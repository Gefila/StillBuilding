# ──────────────────────────────────────────────────────────
# INITIAL SETUP ONLY — Use this for the first Certbot run.
# After obtaining the SSL certificate, switch back to
# the main config in nginx/conf.d/default.conf
# ──────────────────────────────────────────────────────────

server {
    listen 80;
    server_name api.stillbuilding.gefila.dev;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Temporarily proxy to API (HTTP only, before SSL is ready)
    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
